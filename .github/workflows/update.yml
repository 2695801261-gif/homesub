name: 更新家宽订阅

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: pip install --quiet requests

      - name: 抓池 + 测活 + 生成订阅
        env:
          SUB_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          CANDIDATES: "5000"
        run: |
          if [ -f tools/run_all.py ]; then
            python tools/run_all.py
          else
            python run_all.py
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
